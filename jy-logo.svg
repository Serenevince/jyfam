<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
  
  <!-- Logo Emblem: Circle with Cross and Dove -->
  <circle cx="40" cy="40" r="32" fill="#0C1D36" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Radiant Cross -->
  <path d="M40 16 L40 64 M26 30 L54 30" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Holy Spirit Dove / Flame Outline -->
  <path d="M33 34 C36 28 44 28 47 34 C43 38 37 38 33 34 Z" fill="#FFFFFF" opacity="0.9" />
  <circle cx="40" cy="30" r="2.5" fill="#F59E0B" />
  
  <!-- Typography -->
  <text x="82" y="32" font-family="'Cinzel', 'Outfit', Georgia, serif" font-size="19" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">JESUS YOUTH</text>
  <text x="82" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="url(#goldGrad)" letter-spacing="2">THRISSUR ZONE</text>
  <text x="82" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#94A3B8" letter-spacing="1">33rd FAMILY GATHERING 2026</text>
</svg>
