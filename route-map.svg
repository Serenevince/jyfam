<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="venueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="townGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="nhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    
    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="venuePulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Marker Arrows -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="950" height="560" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid lines -->
  <g opacity="0.07" stroke="#94A3B8" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="560" />
    <line x1="150" y1="0" x2="150" y2="560" />
    <line x1="250" y1="0" x2="250" y2="560" />
    <line x1="350" y1="0" x2="350" y2="560" />
    <line x1="450" y1="0" x2="450" y2="560" />
    <line x1="550" y1="0" x2="550" y2="560" />
    <line x1="650" y1="0" x2="650" y2="560" />
    <line x1="750" y1="0" x2="750" y2="560" />
    <line x1="850" y1="0" x2="850" y2="560" />
    <line x1="0" y1="100" x2="950" y2="100" />
    <line x1="0" y1="200" x2="950" y2="200" />
    <line x1="0" y1="300" x2="950" y2="300" />
    <line x1="0" y1="400" x2="950" y2="400" />
    <line x1="0" y1="500" x2="950" y2="500" />
  </g>

  <!-- Header Banner on Diagram -->
  <rect x="30" y="22" width="890" height="48" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="50" y="52" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">
    SCHEMATIC ROUTE MAP: REACHING ST. PAUL'S C.E.H.S.S., KURIACHIRA
  </text>
  <text x="730" y="51" fill="#F59E0B" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">
    📍 Family Gathering 2026
  </text>

  <!-- ================= ROADS LAYER ================= -->

  <!-- NH 544 Highway (National Highway corridor on the Right/East side) -->
  <!-- NH 544 road bed -->
  <path d="M 820 60 L 820 520" stroke="#064E3B" stroke-width="26" stroke-linecap="round" />
  <path d="M 820 60 L 820 520" stroke="#10B981" stroke-width="16" stroke-linecap="round" />
  <path d="M 820 60 L 820 520" stroke="#F8FAFC" stroke-width="2" stroke-dasharray="12,12" opacity="0.6" />

  <!-- Road 1: Thrissur Town Route (Blue) -->
  <!-- Swaraj Round / Sakthan -> Kokkalai -> Koorkenchery -> Kuriachira -->
  <path d="M 170 120 L 240 180 L 290 270 L 370 340 L 460 340" 
        stroke="#1E3A8A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 170 120 L 240 180 L 290 270 L 370 340 L 460 340" 
        stroke="#38BDF8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 170 120 L 240 180 L 290 270 L 370 340 L 460 340" 
        stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8,8" />

  <!-- Road 2: NH 544 from Kuttanellur Junction (Green) -->
  <!-- NH 544 (x=820, y=170) -> Kuttanellur Junction -> Ollur Road -> Kuriachira (x=460, y=340) -->
  <path d="M 820 170 L 710 190 L 590 260 L 490 320 L 460 340" 
        stroke="#065F46" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 820 170 L 710 190 L 590 260 L 490 320 L 460 340" 
        stroke="#34D399" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 820 170 L 710 190 L 590 260 L 490 320 L 460 340" 
        stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8,8" />

  <!-- Road 3: NH 544 from Ollur Bypass / Paliakkara Toll side (Amber/Orange) -->
  <!-- NH 544 (x=820, y=450) -> Ollur Junction (x=590, y=440) -> Kuriachira (x=460, y=340) -->
  <path d="M 820 450 L 680 450 L 580 430 L 460 340" 
        stroke="#78350F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M 820 450 L 680 450 L 580 430 L 460 340" 
        stroke="#F59E0B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cross-link: Koorkenchery to Ollur connecting road -->
  <path d="M 290 270 L 360 250 L 470 230" stroke="#334155" stroke-width="5" stroke-dasharray="4,4" />

  <!-- ================= LANDMARKS & NODES ================= -->

  <!-- NODE 1: Thrissur Town / Sakthan Private Bus Stand -->
  <g transform="translate(170, 120)">
    <circle cx="0" cy="0" r="32" fill="#1E293B" stroke="#38BDF8" stroke-width="3" filter="url(#glow)" />
    <circle cx="0" cy="0" r="22" fill="url(#townGrad)" />
    <text x="0" y="5" text-anchor="middle" font-size="14" fill="#FFFFFF">🏙️</text>
    <!-- Label -->
    <rect x="-105" y="-62" width="210" height="38" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <text x="0" y="-45" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">THRISSUR TOWN</text>
    <text x="0" y="-31" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#93C5FD">Sakthan Stand / Swaraj Round</text>
  </g>

  <!-- Landmark: Kokkalai Junction -->
  <g transform="translate(240, 180)">
    <circle cx="0" cy="0" r="7" fill="#F8FAFC" stroke="#0284C7" stroke-width="2.5" />
    <text x="-12" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">Kokkalai</text>
  </g>

  <!-- Landmark: Koorkenchery Junction -->
  <g transform="translate(290, 270)">
    <circle cx="0" cy="0" r="8" fill="#F8FAFC" stroke="#0284C7" stroke-width="3" />
    <rect x="-85" y="14" width="125" height="22" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="-22" y="29" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#38BDF8">Koorkenchery Jnc</text>
  </g>

  <!-- Landmark: Kuriachira Bus Stop (Direct Bus drop point) -->
  <g transform="translate(390, 340)">
    <circle cx="0" cy="0" r="8" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" />
    <rect x="-70" y="-38" width="140" height="26" rx="5" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
    <text x="0" y="-21" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FDE68A">🚌 Kuriachira Bus Stop</text>
    <line x1="0" y1="-12" x2="0" y2="-4" stroke="#F59E0B" stroke-width="2" />
  </g>

  <!-- ================= TARGET VENUE: ST. PAUL'S C.E.H.S.S. ================= -->
  <g transform="translate(460, 340)">
    <!-- Big Pulsing Rings -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.4" />
    <circle cx="0" cy="0" r="32" fill="#FEF2F2" stroke="#DC2626" stroke-width="4" filter="url(#venuePulse)" />
    <circle cx="0" cy="0" r="22" fill="url(#venueGlow)" />
    <text x="0" y="7" text-anchor="middle" font-size="16" fill="#FFFFFF">✝️</text>

    <!-- Venue Card Overlay -->
    <rect x="-135" y="44" width="270" height="84" rx="10" fill="#0C1D36" stroke="#EF4444" stroke-width="2" filter="url(#glow)" />
    <text x="0" y="66" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">ST. PAUL'S C.E.H.S.S.</text>
    <text x="0" y="82" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#F59E0B">Kuriachira, Thrissur (680006)</text>
    <text x="0" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#E2E8F0">⭐ PROGRAM VENUE: FAMILY GATHERING 2026</text>
    <text x="0" y="114" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#38BDF8">Near St. Joseph's Church / Carmel Convent</text>
  </g>

  <!-- NODE 2: NH 544 Kuttanellur Junction -->
  <g transform="translate(820, 170)">
    <circle cx="0" cy="0" r="24" fill="url(#nhGrad)" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)" />
    <text x="0" y="5" text-anchor="middle" font-size="12" fill="#FFFFFF">🛣️</text>
    <rect x="-195" y="-20" width="165" height="40" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
    <text x="-112" y="-4" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">NH 544 KUTTANELLUR</text>
    <text x="-112" y="10" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#6EE7B7">Bypass Exit from Kochi / Palakkad</text>
  </g>

  <!-- Landmark: Ollur Junction -->
  <g transform="translate(580, 430)">
    <circle cx="0" cy="0" r="8" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" />
    <rect x="-55" y="14" width="110" height="22" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
    <text x="0" y="29" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FDE68A">Ollur Junction</text>
  </g>

  <!-- NODE 3: NH 544 Paliakkara / Amballur side (South) -->
  <g transform="translate(820, 450)">
    <circle cx="0" cy="0" r="20" fill="#78350F" stroke="#F59E0B" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-size="11" fill="#FFFFFF">🚗</text>
    <rect x="-185" y="-18" width="155" height="36" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1" />
    <text x="-107" y="-2" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">NH 544 OLLUR EXIT</text>
    <text x="-107" y="11" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#FCD34D">From Chalakudy / Angamaly</text>
  </g>

  <!-- NH 544 Title Labels along the highway -->
  <text x="860" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#10B981" letter-spacing="2">NH 544</text>
  <text x="855" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#94A3B8">TO MANNUTHY &amp; PALAKKAD &#x2191;</text>
  <text x="855" y="500" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#94A3B8">TO CHALAKUDY &amp; KOCHI &#x2193;</text>

  <!-- ================= ROUTE DISTANCE BADGES ================= -->

  <!-- Badge 1: Town Route Info -->
  <g transform="translate(230, 310)">
    <rect x="0" y="0" width="135" height="42" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <text x="10" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#38BDF8">&#x2192; FROM TOWN ROUTE</text>
    <text x="10" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">3.5 KM &#x2022; 8-10 Mins</text>
  </g>

  <!-- Badge 2: NH 544 Route Info -->
  <g transform="translate(620, 210)">
    <rect x="0" y="0" width="145" height="42" rx="8" fill="#0F172A" stroke="#34D399" stroke-width="1.5" />
    <text x="10" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#34D399">&#x2192; FROM NH 544 BYPASS</text>
    <text x="10" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">4.5 KM &#x2022; 10-12 Mins</text>
  </g>

  <!-- ================= LEGEND BOX (BOTTOM LEFT) ================= -->
  <g transform="translate(30, 420)">
    <rect x="0" y="0" width="310" height="110" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">MAP LEGEND &amp; TRANSIT GUIDE</text>
    
    <!-- Legend item 1 -->
    <line x1="16" y1="44" x2="42" y2="44" stroke="#38BDF8" stroke-width="4" />
    <text x="50" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#E2E8F0">From Thrissur Town / Sakthan Stand (Car &amp; Bus)</text>

    <!-- Legend item 2 -->
    <line x1="16" y1="66" x2="42" y2="66" stroke="#34D399" stroke-width="4" />
    <text x="50" y="69" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#E2E8F0">From NH 544 Kuttanellur Bypass (Car / Highway)</text>

    <!-- Legend item 3 -->
    <line x1="16" y1="88" x2="42" y2="88" stroke="#F59E0B" stroke-width="4" />
    <text x="50" y="91" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#E2E8F0">From NH 544 Ollur / Paliakkara Route</text>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(900, 80)">
    <circle cx="0" cy="0" r="18" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <text x="0" y="-4" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#EF4444">N</text>
    <text x="0" y="11" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#64748B">&#x2191;</text>
  </g>
</svg>
